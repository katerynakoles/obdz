# Файл опису середовища для лабораторної роботи №5 курсу «Організація баз даних і знань».
# Neo4j у контейнері; дані графа зберігаються в томі й переживають видалення контейнера.
#
# Це окремий файл поруч із compose.yaml роботи №1 і compose-nosql.yaml роботи №4:
# середовища попередніх робіт лишаються запущеними і не заважають одне одному.
#
# Команди виконуються в терміналі в каталозі з цим файлом (у Windows - PowerShell або Windows Terminal).
# Перед запуском має працювати Docker Desktop (Windows, macOS) або служба Docker (Linux).
#
# Запуск:    docker compose -f compose-neo4j.yaml up -d
# Стан:      docker compose -f compose-neo4j.yaml ps
# Зупинка:   docker compose -f compose-neo4j.yaml down       (томи лишаються)
# Обережно:  docker compose -f compose-neo4j.yaml down -v    (видаляє й томи з даними)
#
# Neo4j Browser: http://localhost:7474, користувач neo4j, пароль studentpass.
# Перший запуск триває довше за інші системи курсу: поки сторінка не відкрилася,
# стан контейнера перевіряють командою docker compose -f compose-neo4j.yaml logs neo4j.
#
# Пароль записано у файлі свідомо: це навчальне середовище на власному компʼютері.
# Neo4j вимагає пароля щонайменше з восьми символів, тому тут не student, як у решті робіт.

name: dbsa-graph

services:
  neo4j:
    image: neo4j:5.26.30-community
    environment:
      NEO4J_AUTH: neo4j/studentpass
    ports:
      # порт на компʼютері : порт у контейнері
      - "7474:7474"   # Neo4j Browser у вікні браузера
      - "7687:7687"   # підключення клієнтів (протокол Bolt)
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs

volumes:
  neo4jdata:
  neo4jlogs:
